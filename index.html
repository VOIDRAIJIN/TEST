<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MODERN FRONTLINE</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
}

body {
    margin: 0;
    overflow: hidden;
    background: #080a0b;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

canvas {
    display: block;
}

/* ================= HUD ================= */

#hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    display: none;
}

#crosshair {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px;
    font-weight: bold;
}

#topLeft {
    position: absolute;
    top: 25px;
    left: 25px;
    line-height: 1.7;
    text-shadow: 0 2px 4px black;
}

#topRight {
    position: absolute;
    top: 25px;
    right: 25px;
    text-align: right;
    line-height: 1.7;
}

#bottomLeft {
    position: absolute;
    bottom: 25px;
    left: 25px;
    font-size: 18px;
}

#bottomRight {
    position: absolute;
    bottom: 25px;
    right: 25px;
    text-align: right;
}

#ammo {
    font-size: 42px;
    font-weight: bold;
}

#weaponName {
    font-size: 15px;
    opacity: .7;
}

#healthBar {
    width: 220px;
    height: 10px;
    background: #222;
    margin-top: 7px;
}

#healthFill {
    width: 100%;
    height: 100%;
    background: #ddd;
}

#objectiveBox {
    position: absolute;
    top: 100px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
}

#objectiveName {
    font-size: 22px;
    font-weight: bold;
}

#objectiveProgress {
    width: 220px;
    height: 8px;
    background: #222;
    margin-top: 8px;
}

#objectiveFill {
    width: 0%;
    height: 100%;
    background: white;
}

#message {
    position: absolute;
    left: 50%;
    top: 65%;
    transform: translate(-50%, -50%);
    font-size: 24px;
    font-weight: bold;
    opacity: 0;
    transition: opacity .2s;
}

/* ================= MENU ================= */

#menu {
    position: fixed;
    inset: 0;
    z-index: 10;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            rgba(0,0,0,.45),
            rgba(0,0,0,.92)
        );
}

#menu h1 {
    margin: 0;
    font-size: clamp(45px, 8vw, 100px);
    letter-spacing: 10px;
}

#menu h2 {
    font-size: 14px;
    letter-spacing: 6px;
    opacity: .6;
    margin-top: 5px;
}

#deploy {
    margin-top: 40px;
    padding: 17px 65px;

    background: transparent;
    color: white;

    border: 1px solid white;

    font-size: 18px;
    letter-spacing: 3px;

    cursor: pointer;

    transition: .2s;
}

#deploy:hover {
    background: white;
    color: black;
    transform: scale(1.05);
}

.controls {
    margin-top: 35px;
    text-align: center;
    font-size: 13px;
    line-height: 2;
    opacity: .55;
}

/* ================= KILL FEED ================= */

#killFeed {
    position: absolute;
    top: 150px;
    right: 25px;
    text-align: right;
    font-size: 13px;
}

.kill {
    margin-bottom: 7px;
    animation: fadeKill 4s forwards;
}

@keyframes fadeKill {
    0% { opacity: 1; }
    80% { opacity: .8; }
    100% { opacity: 0; }
}

/* ================= DAMAGE ================= */

#damageFlash {
    position: fixed;
    inset: 0;
    background: rgba(255,0,0,.25);
    pointer-events: none;
    opacity: 0;
}
</style>

<!-- ================= MENU ================= -->

<div id="menu">

    <h1>MODERN FRONTLINE</h1>
    <h2>TACTICAL COMBAT SIMULATION</h2>

    <button id="deploy">
        DEPLOY
    </button>

    <div class="controls">
        WASD — MOVE<br>
        SHIFT — SPRINT<br>
        MOUSE — AIM<br>
        LEFT CLICK — FIRE<br>
        R — RELOAD<br>
        ESC — RELEASE MOUSE
    </div>

</div>

<!-- ================= HUD ================= -->

<div id="hud">

    <div id="crosshair">+</div>

    <div id="topLeft">
        <b>ALPHA SQUAD</b><br>
        SECTOR: URBAN FRONT
    </div>

    <div id="topRight">
        SCORE: <span id="score">0</span><br>
        KILLS: <span id="kills">0</span>
    </div>

    <div id="objectiveBox">
        <div id="objectiveName">
            OBJECTIVE A
        </div>

        <div id="objectiveProgress">
            <div id="objectiveFill"></div>
        </div>
    </div>

    <div id="bottomLeft">

        HEALTH
        <div id="healthBar">
            <div id="healthFill"></div>
        </div>

        ARMOR:
        <span id="armor">100</span>

    </div>

    <div id="bottomRight">

        <div id="weaponName">
            AR-45 ASSAULT RIFLE
        </div>

        <span id="ammo">30</span>
        /
        <span id="reserve">120</span>

    </div>

    <div id="killFeed"></div>

    <div id="message"></div>

</div>

<div id="damageFlash"></div>

<!-- Three.js -->

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* ==========================================================
   GAME VARIABLES
========================================================== */

let scene;
let camera;
let renderer;
let clock;

let player;

const enemies = [];
const keys = {};

const game = {

    started: false,

    health: 100,
    armor: 100,

    ammo: 30,
    reserve: 120,

    score: 0,
    kills: 0,

    objective: 0,
    objectiveProgress: 0,

    yaw: 0,
    pitch: 0,

    lastShot: 0,

    fireRate: 120,

    reloading: false,

    enemySpawnTimer: 0

};


/* ==========================================================
   INITIALIZE
========================================================== */

function init() {

    clock = new THREE.Clock();

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(
            0x657078
        );

    scene.fog =
        new THREE.Fog(
            0x657078,
            45,
            350
        );


    camera =
        new THREE.PerspectiveCamera(
            75,
            innerWidth / innerHeight,
            .1,
            1000
        );


    renderer =
        new THREE.WebGLRenderer({
            antialias: true
        });


    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.setPixelRatio(
        Math.min(
            devicePixelRatio,
            2
        )
    );

    renderer.shadowMap.enabled = true;

    document.body.appendChild(
        renderer.domElement
    );


    createLighting();
    createWorld();
    createObjectives();
    createPlayer();

    updateHUD();

    animate();
}


/* ==========================================================
   LIGHTING
========================================================== */

function createLighting() {

    const sun =
        new THREE.DirectionalLight(
            0xffffff,
            2.2
        );

    sun.position.set(
        100,
        150,
        80
    );

    sun.castShadow = true;

    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;

    scene.add(sun);


    const ambient =
        new THREE.HemisphereLight(
            0xffffff,
            0x303030,
            1.2
        );

    scene.add(ambient);
}


/* ==========================================================
   WORLD
========================================================== */

function createWorld() {

    const ground =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                500,
                500
            ),

            new THREE.MeshStandardMaterial({
                color: 0x41473f
            })
        );


    ground.rotation.x =
        -Math.PI / 2;

    ground.receiveShadow = true;

    scene.add(ground);


    /* Roads */

    for (
        let i = -200;
        i <= 200;
        i += 50
    ) {

        const road =
            new THREE.Mesh(
                new THREE.PlaneGeometry(
                    14,
                    500
                ),

                new THREE.MeshStandardMaterial({
                    color: 0x282a2a
                })
            );


        road.rotation.x =
            -Math.PI / 2;

        road.position.x =
            i;

        road.position.y =
            .02;

        scene.add(road);
    }


    /* Buildings */

    for (
        let i = 0;
        i < 55;
        i++
    ) {

        const width =
            7 +
            Math.random() * 15;

        const depth =
            7 +
            Math.random() * 15;

        const height =
            5 +
            Math.random() * 22;


        const building =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    width,
                    height,
                    depth
                ),

                new THREE.MeshStandardMaterial({
                    color:
                        0x464646 +
                        Math.floor(
                            Math.random() *
                            0x181818
                        )
                })

            );


        building.position.set(

            Math.round(
                (Math.random() - .5) *
                220 / 10
            ) * 10,

            height / 2,

            Math.round(
                (Math.random() - .5) *
                220 / 10
            ) * 10

        );


        building.castShadow = true;
        building.receiveShadow = true;

        scene.add(building);
    }


    /* Cover objects */

    for (
        let i = 0;
        i < 40;
        i++
    ) {

        const box =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    3,
                    1.5,
                    2
                ),

                new THREE.MeshStandardMaterial({
                    color: 0x57534b
                })

            );


        box.position.set(
            (Math.random() - .5) * 250,
            .75,
            (Math.random() - .5) * 250
        );


        box.castShadow = true;

        scene.add(box);
    }
}


/* ==========================================================
   OBJECTIVES
========================================================== */

const objectivePositions = [
    [-60, -60],
    [60, -10],
    [-40, 70]
];


const objectiveMeshes = [];


function createObjectives() {

    objectivePositions.forEach(
        (pos, index) => {

            const zone =
                new THREE.Mesh(

                    new THREE.CylinderGeometry(
                        9,
                        9,
                        .2,
                        32
                    ),

                    new THREE.MeshBasicMaterial({
                        color: 0xffffff,
                        transparent: true,
                        opacity: .35
                    })

                );


            zone.position.set(
                pos[0],
                .1,
                pos[1]
            );


            scene.add(zone);

            objectiveMeshes.push(zone);
        }
    );
}


/* ==========================================================
   PLAYER
========================================================== */

function createPlayer() {

    player =
        new THREE.Object3D();


    player.position.set(
        0,
        2,
        100
    );


    scene.add(player);

    player.add(camera);


    camera.position.set(
        0,
        1.6,
        0
    );
}


/* ==========================================================
   PLAYER MOVEMENT
========================================================== */

function updatePlayer(delta) {

    if (!game.started)
        return;


    let speed = 8;


    if (
        keys["ShiftLeft"] ||
        keys["ShiftRight"]
    ) {

        speed = 15;
    }


    const direction =
        new THREE.Vector3();


    if (keys["KeyW"])
        direction.z -= 1;

    if (keys["KeyS"])
        direction.z += 1;

    if (keys["KeyA"])
        direction.x -= 1;

    if (keys["KeyD"])
        direction.x += 1;


    if (
        direction.length() > 0
    ) {

        direction.normalize();


        direction.applyAxisAngle(
            new THREE.Vector3(
                0,
                1,
                0
            ),
            game.yaw
        );


        player.position.add(
            direction.multiplyScalar(
                speed * delta
            )
        );
    }


    player.position.y = 2;
}


/* ==========================================================
   ENEMY CREATION
========================================================== */

function spawnEnemy() {

    const enemy =
        new THREE.Group();


    const body =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.2,
                1.5,
                .7
            ),

            new THREE.MeshStandardMaterial({
                color: 0x792d2d
            })

        );


    body.position.y = 1.1;


    const head =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .4,
                12,
                12
            ),

            new THREE.MeshStandardMaterial({
                color: 0xb18a72
            })

        );


    head.position.y = 2.1;


    enemy.add(body);
    enemy.add(head);


    const angle =
        Math.random() *
        Math.PI * 2;

    const distance =
        90 +
        Math.random() * 80;


    enemy.position.set(

        player.position.x +
        Math.cos(angle) *
        distance,

        0,

        player.position.z +
        Math.sin(angle) *
        distance

    );


    enemy.userData.health = 100;

    enemy.userData.speed =
        1.5 +
        Math.random() * 1.5;

    enemy.userData.attackTimer = 0;


    scene.add(enemy);

    enemies.push(enemy);
}


/* ==========================================================
   ENEMY AI
========================================================== */

function updateEnemies(delta) {

    for (
        let i = enemies.length - 1;
        i >= 0;
        i--
    ) {

        const enemy =
            enemies[i];


        const distance =
            enemy.position.distanceTo(
                player.position
            );


        if (
            distance > 5 &&
            distance < 150
        ) {

            const direction =
                new THREE.Vector3()
                    .subVectors(
                        player.position,
                        enemy.position
                    )
                    .normalize();


            direction.y = 0;


            enemy.position.add(

                direction.multiplyScalar(
                    enemy.userData.speed *
                    delta
                )

            );


            enemy.lookAt(
                player.position.x,
                enemy.position.y,
                player.position.z
            );
        }


        /* Enemy attack */

        enemy.userData.attackTimer -=
            delta;


        if (
            distance < 35 &&
            enemy.userData.attackTimer <= 0
        ) {

            enemy.userData.attackTimer =
                1.2 +
                Math.random();


            damagePlayer(
                4 +
                Math.random() * 5
            );
        }
    }
}


/* ==========================================================
   SHOOTING
========================================================== */

function shoot() {

    if (
        !game.started ||
        game.reloading
    )
        return;


    const now =
        performance.now();


    if (
        now - game.lastShot <
        game.fireRate
    )
        return;


    game.lastShot =
        now;


    if (
        game.ammo <= 0
    ) {

        reload();

        return;
    }


    game.ammo--;

    updateHUD();


    const ray =
        new THREE.Raycaster();


    ray.setFromCamera(
        new THREE.Vector2(
            0,
            0
        ),
        camera
    );


    const targets = [];


    enemies.forEach(
        enemy => {

            enemy.traverse(
                object => {

                    if (
                        object.isMesh
                    )
                        targets.push(
                            object
                        );
                }
            );
        }
    );


    const hits =
        ray.intersectObjects(
            targets
        );


    if (
        hits.length === 0
    )
        return;


    let target =
        hits[0].object;


    while (
        target.parent &&
        !enemies.includes(
            target
        )
    ) {

        target =
            target.parent;
    }


    if (
        !enemies.includes(
            target
        )
    )
        return;


    target.userData.health -= 34;


    if (
        target.userData.health <= 0
    ) {

        eliminateEnemy(
            target
        );
    }
}


/* ==========================================================
   ENEMY ELIMINATION
========================================================== */

function eliminateEnemy(enemy) {

    scene.remove(enemy);


    const index =
        enemies.indexOf(enemy);


    if (index !== -1)
        enemies.splice(
            index,
            1
        );


    game.kills++;

    game.score += 100;


    addKillFeed(
        "ALPHA",
        "HOSTILE"
    );


    updateHUD();


    setTimeout(
        () => {

            if (
                game.started
            )
                spawnEnemy();

        },
        1500
    );
}


/* ==========================================================
   DAMAGE
========================================================== */

function damagePlayer(amount) {

    if (
        game.armor > 0
    ) {

        const blocked =
            Math.min(
                game.armor,
                amount * .6
            );


        game.armor -=
            blocked;


        amount -=
            blocked;
    }


    game.health -= amount;


    flashDamage();


    if (
        game.health <= 0
    ) {

        respawn();
    }


    updateHUD();
}


/* ==========================================================
   RESPAWN
========================================================== */

function respawn() {

    game.health = 100;
    game.armor = 100;

    game.ammo = 30;
    game.reserve = 120;


    player.position.set(
        0,
        2,
        100
    );


    game.score =
        Math.max(
            0,
            game.score - 50
        );


    showMessage(
        "RESPAWNING..."
    );
}


/* ==========================================================
   RELOAD
========================================================== */

function reload() {

    if (
        game.reloading ||
        game.ammo >= 30 ||
        game.reserve <= 0
    )
        return;


    game.reloading = true;

    showMessage(
        "RELOADING"
    );


    setTimeout(
        () => {

            const needed =
                30 -
                game.ammo;


            const amount =
                Math.min(
                    needed,
                    game.reserve
                );


            game.ammo += amount;

            game.reserve -= amount;

            game.reloading = false;

            updateHUD();

        },
        1200
    );
}


/* ==========================================================
   OBJECTIVE SYSTEM
========================================================== */

function updateObjective(delta) {

    if (!game.started)
        return;


    const objective =
        objectiveMeshes[
            game.objective
        ];


    const distance =
        player.position.distanceTo(
            objective.position
        );


    if (
        distance < 12
    ) {

        game.objectiveProgress +=
            delta * 8;


        game.objectiveProgress =
            Math.min(
                100,
                game.objectiveProgress
            );


        if (
            game.objectiveProgress >= 100
        ) {

            game.score += 250;


            game.objectiveProgress = 0;


            game.objective++;


            if (
                game.objective >=
                objectiveMeshes.length
            ) {

                game.objective = 0;
            }


            showMessage(
                "OBJECTIVE CAPTURED"
            );
        }

    } else {

        game.objectiveProgress -=
            delta * 2;


        game.objectiveProgress =
            Math.max(
                0,
                game.objectiveProgress
            );
    }


    updateHUD();
}


/* ==========================================================
   HUD
========================================================== */

function updateHUD() {

    document.getElementById(
        "health"
    ).textContent =
        Math.max(
            0,
            Math.floor(
                game.health
            )
        );


    document.getElementById(
        "armor"
    ).textContent =
        Math.max(
            0,
            Math.floor(
                game.armor
            )
        );


    document.getElementById(
        "ammo"
    ).textContent =
        game.ammo;


    document.getElementById(
        "reserve"
    ).textContent =
        game.reserve;


    document.getElementById(
        "score"
    ).textContent =
        game.score;


    document.getElementById(
        "kills"
    ).textContent =
        game.kills;


    document.getElementById(
        "objectiveName"
    ).textContent =
        "OBJECTIVE " +
        String.fromCharCode(
            65 + game.objective
        );


    document.getElementById(
        "objectiveFill"
    ).style.width =
        game.objectiveProgress +
        "%";


    document.getElementById(
        "healthFill"
    ).style.width =
        Math.max(
            0,
            game.health
        ) +
        "%";
}


/* ==========================================================
   KILL FEED
========================================================== */

function addKillFeed(
    playerName,
    enemyName
) {

    const feed =
        document.getElementById(
            "killFeed"
        );


    const item =
        document.createElement(
            "div"
        );


    item.className =
        "kill";


    item.textContent =
        playerName +
        "  ✦  " +
        enemyName;


    feed.appendChild(
        item
    );


    setTimeout(
        () => item.remove(),
        4000
    );
}


/* ==========================================================
   DAMAGE FLASH
========================================================== */

function flashDamage() {

    const flash =
        document.getElementById(
            "damageFlash"
        );


    flash.style.opacity = 1;


    setTimeout(
        () => {
            flash.style.opacity = 0;
        },
        120
    );
}


/* ==========================================================
   MESSAGE
========================================================== */

let messageTimer;


function showMessage(text) {

    const element =
        document.getElementById(
            "message"
        );


    element.textContent =
        text;


    element.style.opacity = 1;


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(
            () => {

                element.style.opacity =
                    0;

            },
            1500
        );
}


/* ==========================================================
   CONTROLS
========================================================== */

window.addEventListener(
    "keydown",
    event => {

        keys[
            event.code
        ] = true;


        if (
            event.code === "KeyR"
        ) {

            reload();
        }
    }
);


window.addEventListener(
    "keyup",
    event => {

        keys[
            event.code
        ] = false;
    }
);


window.addEventListener(
    "mousedown",
    event => {

        if (
            event.button === 0
        ) {

            shoot();
        }
    }
);


window.addEventListener(
    "mousemove",
    event => {

        if (
            document.pointerLockElement
        ) {

            game.yaw -=
                event.movementX *
                .002;


            game.pitch -=
                event.movementY *
                .002;


            game.pitch =
                Math.max(
                    -1.4,
                    Math.min(
                        1.4,
                        game.pitch
                    )
                );


            player.rotation.y =
                game.yaw;


            camera.rotation.x =
                game.pitch;
        }
    }
);


/* ==========================================================
   DEPLOY
========================================================== */

document
    .getElementById(
        "deploy"
    )
    .addEventListener(
        "click",
        () => {

            game.started =
                true;


            document.getElementById(
                "menu"
            ).style.display =
                "none";


            document.getElementById(
                "hud"
            ).style.display =
                "block";


            document.body.requestPointerLock();


            /* Initial enemies */

            for (
                let i = 0;
                i < 18;
                i++
            ) {

                spawnEnemy();
            }


            updateHUD();
        }
    );


/* ==========================================================
   WINDOW RESIZE
========================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);


/* ==========================================================
   MAIN GAME LOOP
========================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    updatePlayer(
        delta
    );


    updateEnemies(
        delta
    );


    updateObjective(
        delta
    );


    renderer.render(
        scene,
        camera
    );
}


/* ==========================================================
   START
========================================================== */

init();
